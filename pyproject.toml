[project]
name = "cloudcapital"
version = "0.1.0"
description = "Cloud Capital surface backend"
readme = "README.md"
authors = [{ name = "danivpv", email = "danivpv@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
infra = [
    "aws-cdk-lib>=2.260.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
]
economics = [
    "boto3>=1.40",
    "duckdb>=1.2",
]
ai = [
    "boto3>=1.40",
    "duckdb>=1.2",
    "dspy>=3.0",
    "fastapi>=0.115",
    "litellm>=1.60",
    "pydantic>=2.10",
    "uvicorn>=0.30",
]
dev = [
    "aws-sam-cli>=1.166.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.ruff]
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.uv]
default-groups = ["dev", "infra", "economics", "ai"]

[tool.pytest.ini_options]
norecursedirs = ["cdk.out", ".venv", "dist", "build", "node_modules"]
pythonpath = ["."]
